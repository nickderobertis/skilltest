[project]
name = "skilltest-pytest"
version = "0.11.0"
description = "pytest integration for skilltest: auto-collect *.skilltest.yaml cases as pytest tests, built on skilltest-sdk."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nick DeRobertis" }]
# The package ships inline type annotations; together with the empty
# `py.typed` marker beside `__init__.py` this tells type checkers to use them
# (PEP 561). Held to the built wheel by tests/test_wheel_typed.py.
classifiers = ["Typing :: Typed"]
dependencies = [
    "skilltest-sdk==0.11.0",
    "pytest>=8",
]

[project.entry-points.pytest11]
skilltest = "skilltest_pytest.plugin"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

# Development only: resolve the pinned dependency above to the SDK member of the
# repo's uv workspace (root `pyproject.toml`), so both packages share one
# resolution and one lockfile. hatchling ignores this table, so the published
# dist still carries the exact `skilltest-sdk==<version>` pin from [project].
[tool.uv.sources]
skilltest-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skilltest_pytest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
