# Comment on every pull request with the lint and type-check suppressions it adds
# (one sticky comment: each new suppression's rule, stated reason and line), so a
# reviewer sees every bypass without reading the diff line by line.
#
# Deliberately NOT a required status check. It skips fork pull requests (whose
# read-only token cannot upsert a comment), and a required context that never
# reports would block them forever. It is a review artifact, not a gate — the gate
# is `just check`. See references/ci.md.

name: notignored

on:
  pull_request:

# Least privilege: read the tree, write the one sticky comment, nothing else.
permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same ref: only the newest comment is wanted.
concurrency:
  group: notignored-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suppressions:
    # A fork's pull request is granted a read-only token, so the comment upsert
    # would fail on something the contributor has no way to fix.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan diffs against the base branch, which a shallow checkout omits.
          fetch-depth: 0

      # `@v0` floats over 0.x releases, moving only once a release has published,
      # so this review artifact picks up fixes without resolving to unreleased work.
      - uses: nickderobertis/notignored@v0
