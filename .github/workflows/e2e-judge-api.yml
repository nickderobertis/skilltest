name: E2E (API Judge)

# Live end-to-end check for the direct-API judge (ApiJudgeProvider): it calls the
# real Anthropic and OpenAI APIs through curl, exercising strict-JSON structured
# outputs, verdict parsing, and usage normalization end to end. Unlike ci.yml this
# needs network, paid model calls, and the ANTHROPIC_API_KEY / OPENAI_API_KEY
# secrets, so it lives in its own workflow gated to trusted contexts only.
#
# It does NOT need oneharness or any harness CLI — the API judge talks to the
# vendor APIs directly. Each vendor's test self-skips when its key is absent, so
# the job below requires both keys up front: a lane that gates the release must
# prove both vendors, never pass with one silently skipped.
#
# Security: a secret in a public repo must never be reachable by untrusted code.
# GitHub already withholds secrets from fork pull requests; the job `if` below is
# defense in depth — it runs only in the canonical repo and never for a PR whose
# head is a fork, so this workflow can be edited in a fork PR without exposing the
# keys.

# Never on a pull request: this suite contacts a paid external service, so it
# runs at the broader tier — ci.yml calls it on every ordinary push to main, and
# semantic-release cuts no release from that commit unless it succeeds (the
# `chore(release):` commit calls nothing). Also runnable by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-judge-api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: api-judge live e2e
    if: >-
      github.repository == 'nickderobertis/skilltest' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify both judge keys are present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=""
          [ -n "${ANTHROPIC_API_KEY:-}" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "${OPENAI_API_KEY:-}" ] || missing="$missing OPENAI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing (each vendor's test would skip without its key). Sync them with 'gh-secrets manifest sync' (they live in Bitwarden), or set one directly: gh secret set <NAME> --repo ${{ github.repository }}"
            exit 1
          fi

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Channel, components and targets come from rust-toolchain.toml. Turn
          # off this action's own cache (Swatinem/rust-cache runs where wanted)
          # and its default RUSTFLAGS="-D warnings", which would change builds.
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      # The live step runs through nx (`just test-*` -> `pnpm exec nx run
      # skilltest-live-*:live`), so install the pinned pnpm and the locked
      # workspace before it.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies (nx)
        run: just bootstrap-node

      - name: Live e2e against the real Anthropic + OpenAI APIs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: just test-judge-api
