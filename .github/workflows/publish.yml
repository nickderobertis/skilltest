# Build one binary per released platform, stage archive/wheel/npm from that
# binary, and prove installation before publishing. macOS ships Apple Silicon
# only (Intel macOS was discontinued): one native arm64 job builds and installs it.
# Linux/Windows keep native build/archive-run lanes. Linux aggregates staged
# products and publishes crates, Python SDK/pytest, and npm carriers/SDK/vitest.
# Release archive transport consumes this run's artifacts separately on Linux.
# Versions remain synchronized by semantic-release; already-live registry
# versions are skipped. Manual diagnostics default off and never publish.

name: publish

# Tag push is the normal trigger; workflow_dispatch is a manual lever to (re)run
# the publish for whatever version the manifests currently hold — e.g. to finish
# a release whose tag run was lost, since publishing is idempotent (already-live
# versions are skipped). Run it from the branch/tag carrying that version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos_diagnostic:
        description: Build and install the Apple Silicon Darwin packages without publishing
        type: boolean
        default: false

jobs:
  # Native Linux/Windows compilation and installation; Darwin has its own job below.
  binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: github.repository == 'nickderobertis/skilltest' && github.ref_name != 'v0.0.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Non-Darwin platforms from release-platforms.toml.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, bin: skilltest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, bin: skilltest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bin: skilltest.exe }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, bin: skilltest.exe }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Channel, components and targets come from rust-toolchain.toml. Turn
          # off this action's own cache (Swatinem/rust-cache runs where wanted)
          # and its default RUSTFLAGS="-D warnings", which would change builds.
          cache: false
          rustflags: ""

      - name: Require tag/version identity
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          bash scripts/check-release-identity.sh "$GITHUB_REF_NAME" "$version" "$GITHUB_SHA" "$(git rev-parse HEAD)"
      - name: Build the CLI
        run: cargo build --release -p skilltest-cli --bin skilltest --target ${{ matrix.target }}

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage and run the native archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          bash scripts/stage-release-product.sh "$TARGET" "target/$TARGET/release/$BIN" "products/$TARGET"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          bash scripts/verify-release-archive.sh "products/$TARGET" "$TARGET" "$BIN" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: products-${{ matrix.target }}
          path: products
          if-no-files-found: error

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: skilltest-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  darwin:
    name: build aarch64-apple-darwin
    runs-on: macos-14
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.macos_diagnostic == true)) && github.repository == 'nickderobertis/skilltest' && github.ref_name != 'v0.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          # llmlint: ignore[diagnostics_error_or_absent] warnings fail the gate through each Rust project's `cargo clippy ... -- -D warnings` in `just check`; the action's injected RUSTFLAGS="-D warnings" would make CI compile with different flags than local builds and every other workflow (all clear it the same way).
          rustflags: ""
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: extractions/setup-just@v2
      - run: just bootstrap-node
      - name: Require tag/version identity
        if: github.event_name == 'push'
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          bash scripts/check-release-identity.sh "$GITHUB_REF_NAME" "$version" "$GITHUB_SHA" "$(git rev-parse HEAD)"
      - name: Build, stage and install the Apple Silicon Darwin products natively
        run: |
          set -euo pipefail
          target=aarch64-apple-darwin
          cargo build --release --locked -p skilltest-cli --bin skilltest --target "$target"
          cargo build --release --locked -p skilltest-cli --bin skilltest-fake-provider --features fake-provider --target "$target"
          binary="target/$target/release/skilltest"
          bash scripts/stage-release-product.sh "$target" "$binary" "products/$target"
          bash scripts/verify-release-archive.sh "products/$target" "$target" skilltest "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          bash scripts/smoke-python-bundle.sh "$target" "$binary" "target/$target/release/skilltest-fake-provider" "products/$target"
          bash scripts/smoke-npm-bundle.sh "$target" "$binary" "target/$target/release/skilltest-fake-provider" "products/$target"
      - uses: actions/upload-artifact@v4
        with:
          name: skilltest-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/skilltest
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: products-darwin
          path: products
          if-no-files-found: error

  products:
    runs-on: ubuntu-latest
    needs: [binaries, darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: products-*
          merge-multiple: true
          path: products
      - name: Verify every staged archive without executing foreign binaries
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          bash scripts/verify-staged-archives.sh products "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: release-products
          path: products
          if-no-files-found: error

  crates:
    name: crates.io
    needs: products
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'nickderobertis/skilltest' && github.ref_name != 'v0.0.0'
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Channel, components and targets come from rust-toolchain.toml. Turn
          # off this action's own cache (Swatinem/rust-cache runs where wanted)
          # and its default RUSTFLAGS="-D warnings", which would change builds.
          cache: false
          rustflags: ""

      - name: Publish skilltest-core then skilltest-cli (skip versions already live)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          ua='skilltest-ci (https://github.com/nickderobertis/skilltest)'

          on_crates_io() { # name version -> 0 if that version is already published
            curl -fsS -A "$ua" "https://crates.io/api/v1/crates/$1/$2" >/dev/null 2>&1
          }

          publish_crate() {
            local crate="$1" version
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name==\"$crate\") | .version")
            if on_crates_io "$crate" "$version"; then
              echo "skip: $crate@$version already on crates.io"
              return 0
            fi
            echo "publishing: $crate@$version"
            # cargo >=1.66 blocks until the new version is downloadable, so the
            # dependent crate resolves it; poll the API too as a belt-and-braces.
            cargo publish --locked -p "$crate"
            for i in $(seq 1 30); do
              on_crates_io "$crate" "$version" && { echo "live: $crate@$version"; return 0; }
              echo "waiting for $crate@$version in the index ($i)…"; sleep 10
            done
            echo "error: timed out waiting for $crate@$version" >&2; return 1
          }

          publish_crate skilltest-core
          publish_crate skilltest-cli

  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    needs: products
    if: github.event_name == 'push' && github.repository == 'nickderobertis/skilltest' && github.ref_name != 'v0.0.0'
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download the per-target binaries
        uses: actions/download-artifact@v4
        with:
          name: release-products
          path: products

      - name: Build & publish skilltest-sdk then skilltest-pytest (skip versions already live)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail

          pyproject_version() { # dir -> version string from [project]
            grep -E '^version *= *"' "$1/pyproject.toml" | head -1 \
              | sed -E 's/^version *= *"([^"]+)".*/\1/'
          }
          on_pypi() { curl -fsS "https://pypi.org/pypi/$1/$2/json" >/dev/null 2>&1; }

          # Publish the exact staged wheels plus a pure wheel/sdist fallback.
          sdk_version=$(pyproject_version sdks/python)
          if on_pypi skilltest-sdk "$sdk_version"; then
            echo "skip: skilltest-sdk $sdk_version already on PyPI"
          else
            echo "publishing: skilltest-sdk $sdk_version (platform wheels + sdist)"
            python3 scripts/stage-and-verify-release-product.py --check-wheels products
            mkdir -p sdks/python/dist
            cp products/*/*.whl sdks/python/dist/
            rm -rf sdks/python/skilltest_sdk/_bin
            (cd sdks/python && uv build --out-dir dist)
            uv publish sdks/python/dist/*
          fi

          # skilltest-pytest: a pure package, built straight from its project.
          pytest_version=$(pyproject_version plugins/pytest)
          if on_pypi skilltest-pytest "$pytest_version"; then
            echo "skip: skilltest-pytest $pytest_version already on PyPI"
          else
            echo "publishing: skilltest-pytest $pytest_version"
            ( cd plugins/pytest && rm -rf dist && uv build --out-dir dist && uv publish dist/* )
          fi

  npm:
    name: npm
    runs-on: ubuntu-latest
    needs: products
    if: github.event_name == 'push' && github.repository == 'nickderobertis/skilltest' && github.ref_name != 'v0.0.0'
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Download the per-target binaries
        uses: actions/download-artifact@v4
        with:
          name: release-products
          path: products

      - name: Build the SDK then the framework package
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @skill-test/sdk build
          pnpm --filter @skill-test/vitest build

      - name: Publish platform packages, then @skill-test/sdk and @skill-test/vitest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          published_npm() { npm view "$1@$2" version >/dev/null 2>&1; }

          # Every carrier's identity, members and binary must match its declared
          # target and the staged archive before any package reaches the registry.
          python3 scripts/stage-and-verify-release-product.py --check-carriers products

          # The per-platform binary packages must publish BEFORE the SDK: its
          # optionalDependencies pin these exact versions (pnpm rewrites the
          # `workspace:*` specifiers on publish).
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        aarch64-apple-darwin \
                        x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            carriers=("products/$target"/skill-test-cli-*.tgz)
            [ "${#carriers[@]}" -eq 1 ] && [ -f "${carriers[0]}" ] || { echo "error: missing or ambiguous npm carrier for $target; restage release products" >&2; exit 1; }
            packed="${carriers[0]}"
            name=$(python3 -c 'import sys,tomllib;print(next(p["npm_package"] for p in tomllib.load(open("release-platforms.toml","rb"))["platform"] if p["target"]==sys.argv[1]))' "$target")
            version=$(node -p "require('./sdks/typescript/package.json').version")
            if published_npm "$name" "$version"; then
              echo "skip: $name@$version already on npm"
              continue
            fi
            echo "publishing: $name@$version"
            # npm (not pnpm) so the binary keeps its executable bit; these
            # packages have no workspace:* deps for pnpm to rewrite.
            npm publish "$packed" --access public
          done

          publish_pkg() {
            local dir="$1" name version
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if published_npm "$name" "$version"; then
              echo "skip: $name@$version already on npm"
              return 0
            fi
            echo "publishing: $name@$version"
            # pnpm publish rewrites the `workspace:*` deps (the SDK's optional
            # platform packages, vitest's SDK dep) to real versions; --no-git-checks
            # because CI runs on a detached tag.
            ( cd "$dir" && pnpm publish --access public --no-git-checks )
          }

          publish_pkg sdks/typescript @skill-test/sdk
          publish_pkg plugins/vitest @skill-test/vitest

  # Release-time install proof for the Windows platforms: it proves what a
  # consumer installs from the registries, so it runs only when a release is cut
  # (each SDK's scripts/verify[-_]bundled.* states what passing means). The
  # matrix is release-platforms.toml's Windows platforms; the release-target
  # gate holds it to that file.
  verify-windows:
    name: verify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [pypi, npm]
    if: github.event_name == 'push' && github.repository == 'nickderobertis/skilltest' && github.ref_name != 'v0.0.0'
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bin: skilltest.exe }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, bin: skilltest.exe }
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install the published skilltest-sdk and run its bundled CLI
        run: |
          set -euo pipefail
          version="$(grep -E '^version *= *"' sdks/python/pyproject.toml | head -1 | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          uv venv --python 3.12 consumer-py
          # A fresh upload can take a minute to reach the index; retry, then fail.
          for i in $(seq 1 10); do
            uv pip install --python consumer-py/Scripts/python.exe --refresh "skilltest-sdk==$version" && break
            [ "$i" -eq 10 ] && { echo "error: skilltest-sdk==$version did not install from PyPI" >&2; exit 1; }
            echo "waiting for skilltest-sdk==$version on PyPI ($i)…"; sleep 30
          done
          consumer-py/Scripts/python.exe sdks/python/scripts/verify_bundled.py "$version" tests/fixtures/smoke/greeter

      - name: Install the published @skill-test/sdk and run its bundled CLI
        run: |
          set -euo pipefail
          version="$(node -p "require('./sdks/typescript/package.json').version")"
          mkdir consumer-npm
          cd consumer-npm
          npm init -y >/dev/null
          for i in $(seq 1 10); do
            npm install --no-audit --no-fund "@skill-test/sdk@$version" && break
            [ "$i" -eq 10 ] && { echo "error: @skill-test/sdk@$version did not install from npm" >&2; exit 1; }
            echo "waiting for @skill-test/sdk@$version on npm ($i)…"; sleep 30
          done
          node ../sdks/typescript/scripts/verify-bundled.mjs "$version" ../tests/fixtures/smoke/greeter
