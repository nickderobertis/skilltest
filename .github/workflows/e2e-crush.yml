name: E2E (Crush)

# Live end-to-end check that drives the real `crush` CLI through oneharness via the
# built skilltest binary, scored by the fixed claude-code judge. Needs network and
# two secrets: ANTHROPIC_API_KEY (Crush's provider key here) and
# CLAUDE_CODE_OAUTH_TOKEN (the judge). Crush has no system flag, so the skill is
# prepended to the prompt; `crush run -q` prints plain text, which oneharness takes
# as the reply. See docs/e2e.md.
#
# Security: gated to the canonical repo and non-fork PRs (defense in depth around
# the secrets).

# Never on a pull request: this suite contacts a paid external service, so it
# runs at the broader tier — ci.yml calls it on every ordinary push to main, and
# semantic-release cuts no release from that commit unless it succeeds (the
# `chore(release):` commit calls nothing). Also runnable by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-crush-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: crush live e2e
    if: >-
      github.repository == 'nickderobertis/skilltest' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify the required secrets are present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set (Crush's provider key). Sync it: gh-secrets manifest sync, or gh secret set ANTHROPIC_API_KEY --repo ${{ github.repository }}"
            exit 1
          fi
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set (the fixed claude-code judge needs it)."
            exit 1
          fi

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Channel, components and targets come from rust-toolchain.toml. Turn
          # off this action's own cache (Swatinem/rust-cache runs where wanted)
          # and its default RUSTFLAGS="-D warnings", which would change builds.
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: extractions/setup-just@v2

      # The live step runs through nx (`just test-*` -> `pnpm exec nx run
      # skilltest-live-*:live`), so install the pinned pnpm and the locked
      # workspace before it.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies (nx)
        run: just bootstrap-node

      - name: Install oneharness (drives the live check)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          just install-oneharness
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the crush CLI (harness under test) and claude (judge)
        run: |
          npm install -g @charmland/crush @anthropic-ai/claude-code
          crush --version
          claude --version

      - name: Live e2e against the real crush CLI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: just test-harness crush
