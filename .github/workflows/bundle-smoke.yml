# Linux bundle installation proofs against the real CLI and packaging-only fake
# provider. CI's ordinary-PR Mac lane owns the Mac Python/npm assertions.

name: bundle-smoke

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.target }}
    # Skip the release bot's `chore(release):` commit: its tree differs from the
    # commit already checked only in version strings (gate a given commit once).
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Channel, components and targets come from rust-toolchain.toml. Turn
          # off this action's own cache (Swatinem/rust-cache runs where wanted)
          # and its default RUSTFLAGS="-D warnings", which would change builds.
          cache: false
          rustflags: ""

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build the CLI and the fake provider
        run: |
          cargo build --release -p skilltest-cli --bin skilltest --target ${{ matrix.target }}
          cargo build --release -p skilltest-cli --bin skilltest-fake-provider \
            --features fake-provider --target ${{ matrix.target }}

      - name: Install workspace deps (for the npm smoke's pack/build)
        run: pnpm install --frozen-lockfile

      - name: Python bundle smoke
        run: |
          bash scripts/smoke-python-bundle.sh ${{ matrix.target }} \
            "target/${{ matrix.target }}/release/skilltest" \
            "target/${{ matrix.target }}/release/skilltest-fake-provider"

      - name: npm bundle smoke
        run: |
          bash scripts/smoke-npm-bundle.sh ${{ matrix.target }} \
            "target/${{ matrix.target }}/release/skilltest" \
            "target/${{ matrix.target }}/release/skilltest-fake-provider"
