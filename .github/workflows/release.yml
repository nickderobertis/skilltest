# Publish archives from the exact completed tag build, with no second compilation.
name: release
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.head_branch != 'v0.0.0' &&
      github.event.workflow_run.head_repository.full_name == 'nickderobertis/skilltest'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-products
          path: products
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify and upload every declared archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$HEAD" ]
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          bash scripts/check-release-identity.sh "$TAG" "$version" "$HEAD" "$(git rev-parse "$TAG^{commit}")"
          bash scripts/verify-staged-archives.sh products "${TAG#v}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG"
          find products -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber '{}' +
