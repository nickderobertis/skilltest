# Build and publish cross-platform `skilltest` binaries on a version tag.
#
# Push a tag like `v0.1.0` and this builds the CLI for each supported platform on
# a native runner (only x86_64-apple-darwin cross-compiles), then uploads a
# `.tar.gz` (a `.zip` holding skilltest.exe on Windows) plus a `.sha256` checksum
# to the matching GitHub Release. The install script (scripts/install.sh)
# consumes the Unix asset names.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  upload:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Skip the one-time v0.0.0 baseline-seed tag (it exists only to anchor the first
    # semantic-release version at 0.1.0; it must not build or publish anything).
    if: github.ref_name != 'v0.0.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          # release-platforms.toml's platforms, one per line; the release-target
          # gate holds this list to it. Both macOS targets build on the arm
          # runner: x86_64 cross-compiles via `--target` (Apple's toolchain links
          # x86_64 natively). The Intel runner (macos-13, deprecated) queued
          # unreliably and stalled releases. Each Windows target builds natively
          # and archives skilltest.exe as a .zip.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, bin: skilltest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, bin: skilltest }
          - { target: x86_64-apple-darwin, os: macos-14, bin: skilltest }
          - { target: aarch64-apple-darwin, os: macos-14, bin: skilltest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, bin: skilltest.exe }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, bin: skilltest.exe }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Channel, components and targets come from rust-toolchain.toml. Turn
          # off this action's own cache (Swatinem/rust-cache runs where wanted)
          # and its default RUSTFLAGS="-D warnings", which would change builds.
          cache: false
          rustflags: ""

      - name: Build and upload the binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          # The action appends .exe itself on Windows; matrix.bin records the
          # built file's name for the release-target gate.
          bin: skilltest
          target: ${{ matrix.target }}
          # Deterministic asset name the install script depends on:
          # skilltest-<target>.tar.gz (+ .sha256); .zip on Windows.
          archive: skilltest-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

      # Prove the published asset rather than the build tree: download what was
      # just uploaded and run the binary it holds on this target's own runner.
      - name: Verify the released archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          dir="$RUNNER_TEMP/released"
          mkdir -p "$dir"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir "$dir" --pattern "skilltest-$TARGET.*"
          bash scripts/verify-release-archive.sh "$dir" "$TARGET" "$BIN" "${GITHUB_REF_NAME#v}"
