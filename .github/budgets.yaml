schema_version: 1
budgets:
  - id: skilltest-macos-jobs-per-run
    description: >-
      Maximum Mac runner job instances per resolved workflow run, including
      matrices and reusable calls. inner_measure_reason: one run can occupy
      several shared Mac slots even when the lifecycle run count stays within
      its bound. The brief explicitly requests separate jobs/run and
      Mac-spending runs/change bounds; the manager approved these two scheduling
      constraints as separate budgets.
    measure: reported
    command: [node, macos-budget.mjs, --metric, jobs-per-run, --telemetry, .telemetry/macos-policy.json]
    unit: jobs
    direction: max
    threshold: 1
  - id: skilltest-macos-runs-per-change
    description: >-
      Maximum distinct Mac-spending workflow runs in a complete single-push
      automatic lifecycle; explicit manual diagnostics are excluded. The brief
      explicitly requests separate jobs/run and Mac-spending runs/change bounds;
      the manager approved these two scheduling constraints as separate budgets.
    measure: reported
    command: [node, macos-budget.mjs, --metric, runs-per-change, --telemetry, .telemetry/macos-policy.json]
    unit: runs
    direction: max
    threshold: 2
