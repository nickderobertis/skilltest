[workspace]
resolver = "2"
members = ["crates/skilltest-core", "crates/skilltest-cli"]

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/nickderobertis/skilltest"
authors = ["Nick DeRobertis"]

[workspace.dependencies]
skilltest-core = { path = "crates/skilltest-core", version = "0.10.0" }
# The extracted simulated-interaction + judging engine. skilltest composes over
# its prompt-building / verdict-parsing so the two share one source of truth for
# how a judge is asked and how its reply is read. Pinned to the 0.2.x line.
onejudge = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_yaml = "0.9"
thiserror = "2"
# Mock-rule `pattern` matchers. The linear-time RE2-style engine, so a
# user-supplied pattern can never hang a run; mirrors the crate oneharness
# uses, keeping the two sides' regex semantics identical.
regex = "1"
clap = { version = "4", features = ["derive"] }

[profile.dev]
# Faster incremental e2e runs; the e2e suite spawns the binary many times.
opt-level = 0
