[workspace]
resolver = "2"
members = [
  "crates/skilltest-core",
  "crates/skilltest-cli",
  # Test-only crates (publish = false): the binary e2e tier and the live suites,
  # each an nx project of its own (see AGENTS.md "Project graph").
  "crates/skilltest-cli-e2e",
  "live/claude",
  "live/judge-api",
]

[workspace.package]
version = "0.12.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/nickderobertis/skilltest"
authors = ["Nick DeRobertis"]

[workspace.dependencies]
skilltest-core = { path = "crates/skilltest-core", version = "0.12.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
serde_yaml = "0.9"
thiserror = "2"
# Mock-rule `pattern` matchers. The linear-time RE2-style engine, so a
# user-supplied pattern can never hang a run; mirrors the crate oneharness
# uses, keeping the two sides' regex semantics identical.
regex = "1"
clap = { version = "4", features = ["derive"] }

[profile.dev]
# Faster incremental e2e runs; the e2e suite spawns the binary many times.
# The debuginfo level for dev/test builds lives in `.cargo/config.toml`; cargo
# merges its `[profile.dev]` with this one key by key.
opt-level = 0
