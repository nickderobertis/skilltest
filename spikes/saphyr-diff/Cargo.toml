# Throwaway differential harness for the serde_yaml -> serde-saphyr spike
# (plan authoring:serde-yaml-replacement). Not a workspace member and never
# landed: it has its own `[workspace]` so the repo's Cargo.lock is untouched.
# Run: spikes/saphyr-diff/run.sh
[package]
name = "saphyr-diff"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
skilltest-core = { path = "../../crates/skilltest-core" }
serde = { version = "1", features = ["derive"] }
# preserve_order so a schema-less walk's key order is visible in the diff.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "=0.9.34"
serde-saphyr = "=1.3.0"
saphyr = "=0.2.1"
