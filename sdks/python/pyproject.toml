[project]
name = "skilltest-sdk"
version = "0.11.1"
description = "Python SDK for the skilltest CLI: run AI-skill tests and natural-language evals from Python, with a typed report contract."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Nick DeRobertis" }]
# The package ships inline type annotations; together with the empty
# `py.typed` marker beside `__init__.py` this tells type checkers to use them
# (PEP 561). Held to the built wheel by tests/test_wheel_typed.py.
classifiers = ["Typing :: Typed"]
dependencies = [
    "pydantic>=2.7",
    # Bundles the `oneharness` binary the default provider drives, so installing
    # the SDK is all the setup a live run needs — no separate oneharness install.
    # The runner points skilltest at it via SKILLTEST_ONEHARNESS_BIN. Bounded to
    # the 0.16.x line skilltest's OneharnessProvider targets: 0.16 is the first
    # line that parses the baseline `oneharness.toml`'s `run_mode` key, so the
    # repo-root config no longer needs an env-spelled workaround.
    "oneharness-cli>=0.16.0,<0.17",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.62.0",
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skilltest_sdk"]

# A platform build drops the prebuilt CLI at skilltest_sdk/_bin/skilltest (which
# is git-ignored), then `scripts/build-python-wheel.sh` retags the wheel for the
# target platform. Listing it as an artifact overrides the VCS-ignore so the
# binary is packed; the pure (py3-none-any) build simply has nothing to match.
artifacts = ["skilltest_sdk/_bin/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated by `just gen-contract` from schemas/ — not hand-maintained, so not
# held to hand-written style; the drift gate and `ty` still cover them.
extend-exclude = [
  "skilltest_sdk/_report.py",
  "skilltest_sdk/_validation.py",
  "skilltest_sdk/_case.py",
  "skilltest_sdk/_error.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
