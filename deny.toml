# cargo-deny configuration. Run via `just audit` (and in CI) before publishing
# binaries. Keep this strict: advisories and disallowed licenses fail the run.

[advisories]
version = 2
yanked = "deny"
ignore = []


[licenses]
version = 2
# Permissive licenses we accept for distributed binaries.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
deny = [
    { name = "serde_yaml", reason = "RUSTSEC-2024-0449: avoid unmaintained libyaml translations; use serde-saphyr" },
    { name = "serde_yaml_ng", reason = "RUSTSEC-2024-0449: avoid unmaintained libyaml translations; use serde-saphyr" },
    { name = "serde_norway", reason = "RUSTSEC-2024-0449: avoid unmaintained libyaml translations; use serde-saphyr" },
    { name = "serde_yml", reason = "RUSTSEC-2024-0449: avoid unmaintained libyaml translations; use serde-saphyr" },
    { name = "unsafe-libyaml", reason = "RUSTSEC-2024-0449: avoid unmaintained libyaml translations; use serde-saphyr" },
    { name = "unsafe-libyaml-norway", reason = "RUSTSEC-2024-0449: avoid unmaintained libyaml translations; use serde-saphyr" },
    { name = "libyml", reason = "RUSTSEC-2024-0449: avoid unmaintained libyaml translations; use serde-saphyr" },
]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
