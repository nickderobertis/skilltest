# cargo-deny configuration. Run via `just audit` (and in CI) before publishing
# binaries. Keep this strict: advisories and disallowed licenses fail the run.

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained (an unmaintained notice, not a known vulnerability); it arrives via serde_yaml 0.9.34+deprecated, a direct dependency of skilltest-core and skilltest-cli. Remove this entry once this repository's YAML parsing moves to serde_norway." },
]

[licenses]
version = 2
# Permissive licenses we accept for distributed binaries.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
