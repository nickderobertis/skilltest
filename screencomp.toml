# screencomp configuration. See https://github.com/nickderobertis/screencomp.

[capture]
# Captures run in a Linux container, but skilltest's shots are deterministic SVGs
# (a vendored, pinned font embedded into each file), so the bytes are identical
# on every arch and runner. One arch lane is therefore enough; its committed
# baseline is shots/baseline/x86_64.json.
arches = ["x86_64"]

[comment]
title = "Terminal screenshots"
marker = "screencomp"        # [A-Za-z0-9_-]; one sticky comment per marker
embed_limit = 10             # embed images inline when <= N shots differ (0 disables)

# One card per command (`run`, `mocks`, `validate`, `init`), all scripted in
# scripts/screenshots.sh. The `run` card carries a `format` toggle the gallery
# flips between the two output formats: the default `human` report and the
# `--format json` machine report (the stable SDK contract). The other cards have
# no toggles.
[[toggle]]
key = "format"
label = "Format"
values = ["human", "json"]

[guard]
# Paths for manual `screencomp scope` queries: changes to the report/eval
# formatters, CLI surface, scaffold text, fake provider, capture machinery, or
# fixtures/font can affect the rendered output. Git pushes do not run capture.
paths = [
  "crates/skilltest-core/src/report.rs",
  "crates/skilltest-core/src/eval.rs",
  "crates/skilltest-cli/src/cli.rs",
  "crates/skilltest-cli/src/scaffold.rs",
  "crates/skilltest-cli/src/bin/fake_provider.rs",
  "scripts/screenshots.sh",
  "screenshots/**",
]
gallery = "shots/review"
